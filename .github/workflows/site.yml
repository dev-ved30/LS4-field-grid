name: Observing-plan website

# Rebuild the GitHub Pages site after every nightly run (published or not, so a
# failed night still shows the latest plans), when plans or site code change on
# the default branch, and on demand.
on:
  workflow_run:
    workflows: ['Nightly observing plan']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'plans/**'
      - 'ls4/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ls4-pages
  cancel-in-progress: true

jobs:
  build:
    # workflow_run fires for runs on any branch; only the default branch publishes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-nightly.lock
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-nightly.lock
      - name: Build the password-protected site from saved plans and published nightly releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LS4_SITE_PASSWORD: ${{ secrets.LS4_SITE_PASSWORD }}
        # Refuses to build (and so to deploy) if the password secret is missing.
        run: python -m ls4 site --releases --require-password --output outputs/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: outputs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
